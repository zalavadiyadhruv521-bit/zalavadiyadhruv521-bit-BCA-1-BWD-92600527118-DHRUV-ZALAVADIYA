<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Properties</title>

    <style>
        h1 {
            color: purple;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
        }

        p {
            color: black;
            text-align: justify;
            text-indent: 50px;
            letter-spacing: 2px;
            line-height: 1.5;
        }

        .text {
            word-spacing: 10px;
            text-decoration: overline;
        }
    </style>
</head>
<body>
    
    <h1>Text Properties in CSS</h1>

    <p>
        This paragraph demonstrates different CSS text properies
        such as color, alignment, indentation, letter spacing and
        line height.
    </p>

    <p class="text">
        This is an exampple of word spacing and text decorations.
    </p>
    
</body>
</html>
