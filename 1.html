<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>

<script>
    // Get student details using prompt dialog boxes
    var name = prompt("Enter Student Name:");
    var studentClass = prompt("Enter Student Class:");
    var stream = prompt("Enter Student Stream:");

    // Display all details in an alert box
    alert("Student Details\n" +
          "Name: " + name + "\n" +
          "Class: " + studentClass + "\n" +
          "Stream: " + stream);
</script>

</body>
</html>
