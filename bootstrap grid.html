<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Table</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Student Details</h2>

    <!-- Table Header -->
    <div class="row bg-dark text-white p-2">
        <div class="col-md-4"><strong>Name</strong></div>
        <div class="col-md-4"><strong>Course</strong></div>
        <div class="col-md-4"><strong>Marks</strong></div>
    </div>

    <!-- Row 1 -->
    <div class="row border p-2">
        <div class="col-md-4">Dhruv</div>
        <div class="col-md-4">BCA</div>
        <div class="col-md-4">44</div>
    </div>

    <!-- Row 2 -->
    <div class="row border p-2">
        <div class="col-md-4">Hitiksha</div>
        <div class="col-md-4">BCA</div>
        <div class="col-md-4">44</div>
    </div>
</div>

</body>
</html>
